name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run builds both platforms and packs the tarball without staging,
  # so the release path can be proven before a version number is spent on it.
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to npm for approval. Leave off to build and pack only.
        type: boolean
        default: false

env:
  ANDROID_JNI_LIBS: android/src/main/jniLibs
  IOS_XCFRAMEWORK: AmbireCryptoFramework.xcframework
  # npm stage landed in 11.15.0; the npm bundled with Node is often older.
  NPM_VERSION: ^11.15.0

jobs:
  build-android:
    name: Build the Android libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Add the Android Rust targets
        # Every ABI in ubrn.config.yaml. A missing one installs fine and then
        # crashes when the module loads on that device.
        run: >
          rustup target add
          aarch64-linux-android armv7-linux-androideabi
          x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build
        run: yarn binaries:android

      - uses: actions/upload-artifact@v4
        with:
          name: android-jni-libs
          path: ${{ env.ANDROID_JNI_LIBS }}
          if-no-files-found: error

  build-ios:
    name: Build the iOS xcframework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Add the iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Build
        run: yarn binaries:ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: ${{ env.IOS_XCFRAMEWORK }}
          if-no-files-found: error

  package:
    name: Pack and stage
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      # Lets npm mint a short-lived token from this run instead of a stored
      # secret, and stamp the package with provenance.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install npm
        run: npm install -g "npm@$NPM_VERSION"

      - name: Check the tag against the version in package.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: android-jni-libs
          path: ${{ env.ANDROID_JNI_LIBS }}

      - uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: ${{ env.IOS_XCFRAMEWORK }}

      - name: Check the binaries made it into place
        # A staged package with nothing in it approves just as cleanly as a full
        # one. The app then silently falls back to the slow JavaScript path.
        run: |
          test -f "$ANDROID_JNI_LIBS/arm64-v8a/libambire_crypto.so"
          test -f "$IOS_XCFRAMEWORK/Info.plist"

      # --ignore-scripts on both npm calls below, because this job installs no
      # dependencies and the `prepare` script would look for patch-package and
      # fail. Nothing here needs a prepack step; the binaries arrive as
      # artifacts.
      - name: Pack
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error

      - name: Stage
        # Nothing is public yet. A maintainer approves the staged version with
        # 2FA, and only then does it reach the registry. Packs a second time
        # rather than staging the tarball above, because provenance is only
        # known to work on the directory form; trusted publishing stamps it
        # without --provenance.
        if: github.event_name == 'push' || inputs.stage
        run: npm stage publish --ignore-scripts

      - name: Summarise what is waiting for approval
        if: github.event_name == 'push' || inputs.stage
        run: |
          name="$(node -p "require('./package.json').name")"
          {
            echo "### Staged, waiting for approval"
            echo
            echo '```'
            npm stage list "$name"
            echo '```'
            echo
            echo "Approve with \`npm stage approve <stage-id>\` (needs 2FA)."
          } >> "$GITHUB_STEP_SUMMARY"
