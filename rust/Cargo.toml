[package]
name = "ambire-crypto"
edition = "2021"
version = "1.0.0"
publish = false

[lib]
# `lib` so the unit tests in tests.rs can reach the crate; `cdylib` is what
# ships (see useSharedLibrary in ubrn.config.yaml).
crate-type = ["lib", "cdylib"]
name = "ambire_crypto"

[dependencies]
uniffi = "=0.31.0"
alloy-primitives = "1"
alloy-dyn-abi = "1"
alloy-json-abi = "1"
serde_json = "1"
thiserror = "2"

[profile.release]
# ubrn reads the exported functions back out of the built library to generate
# the bindings and the turbo-module glue. Stripping would take the symbols it
# reads with them. Android's packaging step strips the .so on its way into the
# APK anyway, so nothing ships with this in it.
strip = "none"

[lints.rust]
nonstandard_style = "deny"
future_incompatible = "warn"

[lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 3 }
# uniffi generates the FFI shim from the exported signatures and needs owned
# arguments, so every `#[uniffi::export]` function trips this. The internal
# helpers all take references already.
needless_pass_by_value = { level = "allow", priority = 4 }
# `#[must_use]` says nothing across an FFI boundary, where the caller is
# generated code that always uses the return value.
must_use_candidate = { level = "allow", priority = 4 }
